<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        li {
            list-style: none;
        }

        img {
            vertical-align: top;
        }

        .title {
            background: #ddd;
            padding: 10px;
            border-bottom: 1px solid #f0f;
            cursor: pointer;
        }

        .title.on {
            background: #333;
            color: #fff;
        }

        .desc {
            background: #eee;
            max-height: 0;
            overflow: hidden;
            transition: .35s;
            opacity: 0;
        }

        .inner {
            width: 100%;
            height: 100%;
            padding: 20px 10px;
        }

        /* ***************************************************************** */
        .tab.on .desc {
            max-height: 200px;
            opacity: 1;
        }

        .tab.on .title {
            background: #333;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="accordion">
        <div class="tab">
            <div class="title">London</div>
            <div class="desc">
                <div class="inner">
                    <h3>London</h3>
                    <p>London is the capital city of England.</p>
                </div>
            </div>
        </div>
        <div class="tab">
            <div class="title">Paris</div>
            <div class="desc">
                <div class="inner">
                    <h3>Paris</h3>
                    <p>Paris is the capital of France.</p>
                </div>
            </div>
        </div>
        <div class="tab">
            <div class="title">Tokyo</div>
            <div class="desc">
                <div class="inner">
                    <h3>Tokyo</h3>
                    <p>Tokyo is the capital of Japan.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const hedings = document.querySelectorAll('.title')
        const tabs = document.querySelectorAll('.tab')
        let activeTab = tabs[0]

        openTab(activeTab)

        hedings.forEach((title) => {
            title.addEventListener('click', function () {
                const parentTab = title.parentNode
                console.log(parentTab);
                if (activeTab) {
                    // 열려있는 탭 close
                    closeTab(activeTab)
                }
                openTab(parentTab)
                activeTab = parentTab
            })

        });
        function openTab(tab) {

            const desc = tab.querySelector('.desc')
            tab.classList.add('on')
            desc.style.maxHeight = desc.scrollHeight + 'px'
            desc.style.opacity = 1

        }
        function closeTab(tab) {
            const desc = tab.querySelector('.desc')
            tab.classList.remove('on')
            desc.style.maxHeight = 0
            desc.style.opacity = 0


        }
    </script>
</body>

</html>
